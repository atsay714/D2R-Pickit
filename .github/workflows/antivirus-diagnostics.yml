name: Controlled antivirus diagnostic builds

on:
  push:
    branches: [codex/antivirus-controlled-builds]
    paths:
      - .github/workflows/antivirus-diagnostics.yml
      - tools/antivirus_diagnostics.py
  workflow_dispatch:
    inputs:
      round:
        description: Diagnostic comparison round
        type: choice
        options: [all, components]
        default: components

permissions:
  contents: read

jobs:
  samples:
    name: Build isolated feature comparisons on one Windows runner
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Build controlled diagnostic variants
        env:
          DIAGNOSTIC_ROUND: ${{ inputs.round || 'components' }}
        run: python tools/antivirus_diagnostics.py --build --variant "$env:DIAGNOSTIC_ROUND"
      - name: Retain diagnostic samples and source manifests
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: antivirus-diagnostic-samples
          path: build-diagnostics/samples/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
